name: 真机验收报告
description: 提交 ALVR 模块的实际设备验收结果
title: "[验证] "
labels: ["verification"]
body:
  - type: input
    id: headset
    attributes:
      label: 头显型号
      description: 例如 Quest 3、Pico 4 Pro、Vive Focus Vision
    validations:
      required: true
  - type: input
    id: alvr-server
    attributes:
      label: ALVR 服务端版本
    validations:
      required: true
  - type: input
    id: alvr-client
    attributes:
      label: ALVR 客户端版本
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: FaceGaze Bridge 版本
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 模块版本（Release tag）
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 结果
      options:
        - 全部正常
        - 部分形状不对
        - 极化/左右反了
        - 连不上
        - 崩溃
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 现象描述
      description: 哪些表情不动、注视方向是否反了、模块日志是否出现「无法识别的前缀块 / 尾部块不完整」
    validations:
      required: true
